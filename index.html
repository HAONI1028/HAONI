<style>
  :root{
    --bg:#0E0F13;
    --card:#18191F;
    --card-2:#202129;
    --ink:#F2F3F5;
    --muted:#A0A3AD;
    --faint:#6E717B;
    --line:#2A2B34;
    --accent:#7B00FF;        /* replaced live with your Discord profile colour */
    --accent-ink:#FFFFFF;
    --fx:#FFFFFF;            /* particle colour */
    --name-font:"Space Grotesk", system-ui, sans-serif;
    --neon-fill:color-mix(in srgb, var(--n1, #fff) 25%, #fff);
    --online:#23A55A;
    --idle:#F0B232;
    --dnd:#F23F43;
    --offline:#80848E;
    --radius:18px;
    --shadow:0 24px 60px rgba(0,0,0,.45);
    color-scheme:dark;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#F3F2F7;
      --card:#FFFFFF;
      --card-2:#F4F4F7;
      --ink:#17181D;
      --muted:#5C5F6A;
      --faint:#8A8D97;
      --line:#E4E3EA;
      --fx:#8A8FA3;
      --neon-fill:var(--n1, #17181D);
      --shadow:0 24px 60px rgba(30,25,70,.12);
      color-scheme:light;
    }
  }
  :root[data-theme="light"]{
    --bg:#F3F2F7;
    --card:#FFFFFF;
    --card-2:#F4F4F7;
    --ink:#17181D;
    --muted:#5C5F6A;
    --faint:#8A8D97;
    --line:#E4E3EA;
    --fx:#8A8FA3;
    --neon-fill:var(--n1, #17181D);
    --shadow:0 24px 60px rgba(30,25,70,.12);
    color-scheme:light;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    font-size:15px;line-height:1.55;
    -webkit-font-smoothing:antialiased;
    padding:48px 16px 64px;
  }
  .bg-glow body{
    background:
      radial-gradient(900px 500px at 15% -10%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%),
      var(--bg);
  }
  a{color:inherit}
  button{font:inherit;color:inherit}
  [hidden]{display:none !important}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

  /* ---------- page backgrounds & effect layers ---------- */
  .page-bg{
    position:fixed;inset:-48px;z-index:-1;
    background-size:cover;background-position:center;
  }
  .page-bg::after{content:"";position:absolute;inset:0;background:color-mix(in srgb, var(--bg) 45%, transparent)}
  .bg-banner .page-bg{filter:blur(26px) saturate(1.2)}
  .bg-banner .page-bg::after{background:color-mix(in srgb, var(--bg) 55%, transparent)}
  .fx-bg,.fx-cursor{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  .fx-bg{z-index:0}
  .fx-cursor{z-index:60}

  .wrap{max-width:620px;margin:0 auto;position:relative;z-index:1}

  /* ---------- card ---------- */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
    transition:opacity .45s ease, transform .15s ease-out;
  }
  .card.tilt{will-change:transform}
  .js-loading .card,.js-loading .live{opacity:0}
  .card-glass .card{
    background:color-mix(in srgb, var(--card) 60%, transparent);
    -webkit-backdrop-filter:blur(18px) saturate(1.3);
            backdrop-filter:blur(18px) saturate(1.3);
  }
  .card-glass .names,.card-glass .fact,.card-glass .activity,.card-glass .link-btn,.card-glass .link-icon{
    background:color-mix(in srgb, var(--card-2) 55%, transparent);
  }
  .card-glass .avatar-ring{background:transparent}

  .banner{
    height:200px;position:relative;
    background:var(--accent);
  }
  .banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .theme-btn{
    position:absolute;top:12px;right:12px;z-index:1;
    width:34px;height:34px;border-radius:50%;
    border:0;background:rgba(0,0,0,.35);color:#fff;cursor:pointer;
    display:grid;place-items:center;font-size:19px;line-height:1;
    backdrop-filter:blur(6px);
    transition:background .15s ease;
  }
  .theme-btn:hover{background:rgba(0,0,0,.55)}

  .head{padding:0 24px;position:relative}
  .avatar-wrap{
    position:relative;width:132px;height:132px;margin-top:-70px;
  }
  .avatar-ring{
    position:absolute;inset:6px;border-radius:50%;
    background:var(--card);padding:6px;
  }
  .avatar{
    width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;
    background:var(--card-2);
  }
  .deco{
    position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);
    pointer-events:none;
  }
  .status{
    position:absolute;right:12px;bottom:12px;z-index:2;
    width:30px;height:30px;border-radius:50%;
    background:var(--offline);border:6px solid var(--card);
  }
  .status[data-s="online"]{background:var(--online)}
  .status[data-s="idle"]{background:var(--idle)}
  .status[data-s="dnd"]{background:var(--dnd)}

  .badges{
    position:absolute;top:14px;right:20px;
    display:flex;gap:2px;padding:4px;
    background:var(--card-2);border:1px solid var(--line);border-radius:10px;
  }
  .badge{
    width:30px;height:30px;display:grid;place-items:center;
    border-radius:7px;position:relative;cursor:default;
  }
  .badge img{width:22px;height:22px}
  .badge:hover,.badge:focus-visible{background:var(--line);outline:none}
  .tip{
    position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
    background:#000;color:#fff;font-size:12px;font-weight:500;white-space:nowrap;
    padding:5px 9px;border-radius:6px;pointer-events:none;
    opacity:0;transition:opacity .12s ease;z-index:3;
  }
  .badge:hover .tip,.badge:focus-visible .tip{opacity:1}

  .names{
    position:relative;overflow:hidden;
    margin:12px 0 0;padding:16px;
    background:var(--card-2);border:1px solid var(--line);border-radius:12px;
  }
  .nameplate{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:right center;
    pointer-events:none;
    -webkit-mask-image:linear-gradient(to right, transparent 0%, #000 70%);
            mask-image:linear-gradient(to right, transparent 0%, #000 70%);
  }
  .names-inner{position:relative}

  /* ---------- display name + effects ---------- */
  .display{
    position:relative;
    font-family:var(--name-font);font-weight:700;
    font-size:var(--name-size, 28px);line-height:1.15;letter-spacing:-.01em;margin:0;
    color:var(--n1, var(--ink));
    overflow-wrap:anywhere;
    width:fit-content;max-width:100%;   /* so gradients span the text, not the whole card */
  }
  .display.fx-solid{color:var(--n1)}
  .display.fx-gradient{
    background:linear-gradient(90deg, var(--n1), var(--n2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .display.fx-glow{
    color:var(--n1);
    text-shadow:0 0 10px color-mix(in srgb, var(--n1) 65%, transparent), 0 0 26px color-mix(in srgb, var(--n1) 40%, transparent);
  }
  .display.fx-neon{
    color:var(--neon-fill);
    text-shadow:0 0 3px var(--n1), 0 0 10px var(--n1), 0 0 22px var(--n1), 0 0 44px color-mix(in srgb, var(--n1) 70%, transparent);
    animation:neon 4s infinite;
  }
  @keyframes neon{0%,17%,21%,24%,52%,56%,100%{opacity:1}19%,23%,54%{opacity:.55}}
  .display.fx-rainbow{
    background:linear-gradient(90deg,#ff4d4d,#ffa94d,#ffe14d,#4dff88,#4dc3ff,#8c6bff,#ff4dd2,#ff4d4d);
    background-size:200% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:rainbow 4s linear infinite;
  }
  @keyframes rainbow{to{background-position:200% 0}}
  .display.fx-shimmer{
    background:linear-gradient(110deg, var(--n1) 0%, var(--n1) 42%, color-mix(in srgb, var(--n1) 25%, #fff) 50%, var(--n1) 58%, var(--n1) 100%);
    background-size:250% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shimmer 3s ease-in-out infinite;
  }
  @keyframes shimmer{0%{background-position:100% 0}70%,100%{background-position:0% 0}}
  .display.fx-toon{
    color:var(--n1);
    -webkit-text-stroke:1.5px #0b0b10;paint-order:stroke fill;
    text-shadow:3px 3px 0 #0b0b10;
  }
  .display.fx-pop{
    color:var(--n1);
    text-shadow:1px 1px 0 var(--n2),2px 2px 0 var(--n2),3px 3px 0 var(--n2),4px 4px 0 var(--n2),6px 6px 10px rgba(0,0,0,.35);
  }
  .display.fx-glitch{color:var(--n1)}
  .display.fx-glitch::before,.display.fx-glitch::after{
    content:attr(data-text);position:absolute;inset:0;pointer-events:none;
  }
  .display.fx-glitch::before{color:#ff2d75;animation:glitch-a 2.6s infinite steps(1)}
  .display.fx-glitch::after{color:#2de2ff;animation:glitch-b 2.6s infinite steps(1)}
  @keyframes glitch-a{
    0%,86%,100%{transform:none;clip-path:inset(0 0 100% 0)}
    88%{transform:translate(3px,-1px);clip-path:inset(10% 0 55% 0)}
    92%{transform:translate(-3px,1px);clip-path:inset(62% 0 6% 0)}
    96%{transform:translate(2px,0);clip-path:inset(30% 0 42% 0)}
  }
  @keyframes glitch-b{
    0%,86%,100%{transform:none;clip-path:inset(0 0 100% 0)}
    89%{transform:translate(-3px,1px);clip-path:inset(55% 0 12% 0)}
    93%{transform:translate(3px,0);clip-path:inset(8% 0 70% 0)}
    97%{transform:translate(-2px,-1px);clip-path:inset(40% 0 30% 0)}
  }

  .handle-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-top:8px;color:var(--muted)}
  .handle{font-weight:500;color:var(--ink)}
  .guild-tag{
    display:inline-flex;align-items:center;gap:4px;
    padding:1px 7px 1px 4px;border-radius:6px;
    background:var(--card);border:1px solid var(--line);
    font-size:12.5px;font-weight:600;color:var(--ink);
  }
  .guild-tag img{width:16px;height:16px}
  .pronouns{font-size:13px}
  .copy-btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:4px 10px;border-radius:999px;cursor:pointer;
    background:var(--card);border:1px solid var(--line);
    font-size:12.5px;font-weight:600;color:var(--muted);
    transition:border-color .15s ease,color .15s ease;
  }
  .copy-btn:hover{border-color:var(--accent);color:var(--ink)}
  .copy-btn.done{border-color:var(--online);color:var(--online)}

  .custom-status{
    display:inline-flex;align-items:center;gap:8px;margin-top:12px;
    padding:7px 12px;border-radius:12px 12px 12px 4px;
    background:var(--card);border:1px solid var(--line);
    font-size:14px;max-width:100%;
  }
  .custom-status img{width:20px;height:20px;flex:none}
  .custom-status .e{font-size:18px;line-height:1}

  .platforms{margin-top:10px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .platforms i{width:8px;height:8px;border-radius:50%;background:var(--offline);flex:none}
  .platforms[data-s="online"] i{background:var(--online)}
  .platforms[data-s="idle"] i{background:var(--idle)}
  .platforms[data-s="dnd"] i{background:var(--dnd)}

  .cta{
    display:inline-flex;align-items:center;gap:9px;margin-top:14px;
    padding:9px 16px;border-radius:10px;text-decoration:none;
    background:var(--accent);color:var(--accent-ink);
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;
    transition:filter .15s ease, transform .08s ease;
  }
  .cta:hover{filter:brightness(1.12)}
  .cta:active{transform:translateY(1px)}
  .cta svg{width:18px;height:18px;fill:currentColor}

  /* ---------- sections ---------- */
  .panel{padding:22px 24px 26px;display:flex;flex-direction:column;gap:22px}
  .label{
    font-family:'Space Grotesk',sans-serif;font-weight:700;
    font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);margin:0 0 8px;
  }
  .caret{display:inline-block;width:2px;height:1.05em;margin-left:2px;vertical-align:-2px;background:currentColor;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  .links-buttons{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
  .link-btn{
    display:flex;align-items:center;gap:10px;min-width:0;
    padding:10px 12px;border-radius:12px;text-decoration:none;
    background:var(--card-2);border:1px solid var(--line);
    font-weight:600;font-size:14px;
    transition:border-color .15s ease, transform .12s ease;
  }
  .link-btn svg{width:20px;height:20px;flex:none;fill:currentColor;transition:fill .15s ease}
  .link-btn .l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .link-btn .go{color:var(--faint);font-size:13px}
  .links-icons{display:flex;flex-wrap:wrap;gap:8px}
  .link-icon{
    width:46px;height:46px;display:grid;place-items:center;border-radius:12px;
    background:var(--card-2);border:1px solid var(--line);
    transition:border-color .15s ease, transform .12s ease;
  }
  .link-icon svg{width:22px;height:22px;fill:currentColor;transition:fill .15s ease}
  .link-btn:hover,.link-icon:hover,.link-btn:focus-visible,.link-icon:focus-visible{border-color:var(--brand, var(--accent));transform:translateY(-1px)}
  .link-btn:hover svg,.link-icon:hover svg,.link-btn:focus-visible svg,.link-icon:focus-visible svg{fill:var(--brand, var(--accent))}

  .activities{display:grid;gap:10px}
  .activity{
    display:flex;gap:14px;align-items:center;
    background:var(--card-2);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;text-decoration:none;
  }
  a.activity:hover{border-color:var(--accent)}
  .activity .art{
    width:60px;height:60px;flex:none;border-radius:10px;position:relative;
    display:grid;place-items:center;font-size:28px;
    background:color-mix(in srgb, var(--accent) 22%, var(--card));
  }
  .activity .art > img{width:100%;height:100%;object-fit:cover;border-radius:10px}
  .activity .art .small{
    position:absolute;right:-5px;bottom:-5px;width:24px;height:24px;border-radius:50%;
    border:3px solid var(--card-2);background:var(--card-2);object-fit:cover;
  }
  .activity .body{min-width:0;flex:1}
  .activity .kind{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .activity .what{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .activity .detail{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .activity .time{color:var(--online);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
  .bar{height:4px;border-radius:2px;background:var(--line);margin-top:8px;overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--ink);width:0}
  .bar-times{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px}

  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .fact{
    background:var(--card-2);border:1px solid var(--line);border-radius:12px;
    padding:10px 14px;
  }
  .fact .k{font-size:12px;color:var(--muted)}
  .fact .v{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;margin-top:2px}

  .live{margin-top:14px;text-align:center;font-size:12px;color:var(--faint);transition:opacity .45s ease}
  .live i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--faint);margin-right:6px;vertical-align:1px}
  .live.on i{background:var(--online);box-shadow:0 0 0 3px color-mix(in srgb, var(--online) 25%, transparent)}

  .foot{margin-top:18px;text-align:center;color:var(--faint);font-size:12.5px}
  .foot a{color:var(--muted)}

  /* ---------- show / hide (from the saved settings) ---------- */
  .hide-banner #banner-img,.hide-decoration #deco,.hide-statusDot #status,.hide-nameplate #nameplate,.hide-badges #badges,
  .hide-serverTag #guild-tag,.hide-pronouns #pronouns,.hide-copyButton #copy-btn,
  .hide-customStatus #custom-status,.hide-platforms #platforms,.hide-discordButton #discord-cta,
  .hide-liveIndicator #live,.hide-themeToggle #theme-btn,.hide-footer #foot{display:none !important}

  @media (max-width:480px){
    body{padding-top:24px}
    .head,.panel{padding-left:16px;padding-right:16px}
    .banner{height:150px}
    .avatar-wrap{width:116px;height:116px;margin-top:-60px}
    .status{right:10px;bottom:10px}
    .badges{right:12px;top:12px}
    .badge{width:26px;height:26px}
    .badge img{width:19px;height:19px}
    .display{font-size:calc(var(--name-size, 28px) * .9)}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important}
    .display,.caret{animation:none !important}
    .display::before,.display::after{display:none}
  }
</style>

    <section class="panel">

        <h2 class="label">About Me</h2>

        <h2 class="label">Links</h2>
        <div class="links" id="links"></div>

        <h2 class="label">Activity</h2>
        <div class="activities" id="activities"></div>

        <h2 class="label">Info</h2>
        <div class="facts" id="facts"></div>

  </article>

  <p class="live" id="live"><i></i><span>Connecting to Discord…</span></p>
  <p class="foot" id="foot">made by <span id="foot-name">haoni</span> · <a href="https://github.com/HAONI1028/haoni" target="_blank" rel="noopener">source</a></p>
