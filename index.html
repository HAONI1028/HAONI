<style>
  :root{
    --bg:#0E0F13;
    --card:#18191F;
    --card-2:#202129;
    --ink:#F2F3F5;
    --muted:#A0A3AD;
    --faint:#6E717B;
    --line:#2A2B34;
    --accent:#7B00FF;        /* replaced live with your Discord profile colour */
    --accent-ink:#FFFFFF;
    --fx:#FFFFFF;            /* particle colour */
    --name-font:"Space Grotesk", system-ui, sans-serif;
    --neon-fill:color-mix(in srgb, var(--n1, #fff) 25%, #fff);
    --online:#23A55A;
    --idle:#F0B232;
    --dnd:#F23F43;
    --offline:#80848E;
    --radius:18px;
    --shadow:0 24px 60px rgba(0,0,0,.45);
    color-scheme:dark;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#F3F2F7;
      --card:#FFFFFF;
      --card-2:#F4F4F7;
      --ink:#17181D;
      --muted:#5C5F6A;
      --faint:#8A8D97;
      --line:#E4E3EA;
      --fx:#8A8FA3;
      --neon-fill:var(--n1, #17181D);
      --shadow:0 24px 60px rgba(30,25,70,.12);
      color-scheme:light;
    }
  }
  :root[data-theme="light"]{
    --bg:#F3F2F7;
    --card:#FFFFFF;
    --card-2:#F4F4F7;
    --ink:#17181D;
    --muted:#5C5F6A;
    --faint:#8A8D97;
    --line:#E4E3EA;
    --fx:#8A8FA3;
    --neon-fill:var(--n1, #17181D);
    --shadow:0 24px 60px rgba(30,25,70,.12);
    color-scheme:light;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    font-size:15px;line-height:1.55;
    -webkit-font-smoothing:antialiased;
    padding:48px 16px 64px;
  }
  .bg-glow body{
    background:
      radial-gradient(900px 500px at 15% -10%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%),
      var(--bg);
  }
  a{color:inherit}
  button{font:inherit;color:inherit}
  [hidden]{display:none !important}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

  /* ---------- page backgrounds & effect layers ---------- */
  .page-bg{
    position:fixed;inset:-48px;z-index:-1;
    background-size:cover;background-position:center;
  }
  .page-bg::after{content:"";position:absolute;inset:0;background:color-mix(in srgb, var(--bg) 45%, transparent)}
  .bg-banner .page-bg{filter:blur(26px) saturate(1.2)}
  .bg-banner .page-bg::after{background:color-mix(in srgb, var(--bg) 55%, transparent)}
  .fx-bg,.fx-cursor{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  .fx-bg{z-index:0}
  .fx-cursor{z-index:60}

  .wrap{max-width:620px;margin:0 auto;position:relative;z-index:1}

  /* ---------- card ---------- */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
    transition:opacity .45s ease, transform .15s ease-out;
  }
  .card.tilt{will-change:transform}
  .js-loading .card,.js-loading .live{opacity:0}
  .card-glass .card{
    background:color-mix(in srgb, var(--card) 60%, transparent);
    -webkit-backdrop-filter:blur(18px) saturate(1.3);
            backdrop-filter:blur(18px) saturate(1.3);
  }
  .card-glass .names,.card-glass .fact,.card-glass .activity,.card-glass .link-btn,.card-glass .link-icon{
    background:color-mix(in srgb, var(--card-2) 55%, transparent);
  }
  .card-glass .avatar-ring{background:transparent}

  .banner{
    height:200px;position:relative;
    background:var(--accent);
  }
  .banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .theme-btn{
    position:absolute;top:12px;right:12px;z-index:1;
    width:34px;height:34px;border-radius:50%;
    border:0;background:rgba(0,0,0,.35);color:#fff;cursor:pointer;
    display:grid;place-items:center;font-size:19px;line-height:1;
    backdrop-filter:blur(6px);
    transition:background .15s ease;
  }
  .theme-btn:hover{background:rgba(0,0,0,.55)}

  .head{padding:0 24px;position:relative}
  .avatar-wrap{
    position:relative;width:132px;height:132px;margin-top:-70px;
  }
  .avatar-ring{
    position:absolute;inset:6px;border-radius:50%;
    background:var(--card);padding:6px;
  }
  .avatar{
    width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;
    background:var(--card-2);
  }
  .deco{
    position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);
    pointer-events:none;
  }
  .status{
    position:absolute;right:12px;bottom:12px;z-index:2;
    width:30px;height:30px;border-radius:50%;
    background:var(--offline);border:6px solid var(--card);
  }
  .status[data-s="online"]{background:var(--online)}
  .status[data-s="idle"]{background:var(--idle)}
  .status[data-s="dnd"]{background:var(--dnd)}

  .badges{
    position:absolute;top:14px;right:20px;
    display:flex;gap:2px;padding:4px;
    background:var(--card-2);border:1px solid var(--line);border-radius:10px;
  }
  .badge{
    width:30px;height:30px;display:grid;place-items:center;
    border-radius:7px;position:relative;cursor:default;
  }
  .badge img{width:22px;height:22px}
  .badge:hover,.badge:focus-visible{background:var(--line);outline:none}
  .tip{
    position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
    background:#000;color:#fff;font-size:12px;font-weight:500;white-space:nowrap;
    padding:5px 9px;border-radius:6px;pointer-events:none;
    opacity:0;transition:opacity .12s ease;z-index:3;
  }
  .badge:hover .tip,.badge:focus-visible .tip{opacity:1}

  .names{
    position:relative;overflow:hidden;
    margin:12px 0 0;padding:16px;
    background:var(--card-2);border:1px solid var(--line);border-radius:12px;
  }
  .nameplate{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:right center;
    pointer-events:none;
    -webkit-mask-image:linear-gradient(to right, transparent 0%, #000 70%);
            mask-image:linear-gradient(to right, transparent 0%, #000 70%);
  }
  .names-inner{position:relative}

  /* ---------- display name + effects ---------- */
  .display{
    position:relative;
    font-family:var(--name-font);font-weight:700;
    font-size:var(--name-size, 28px);line-height:1.15;letter-spacing:-.01em;margin:0;
    color:var(--n1, var(--ink));
    overflow-wrap:anywhere;
    width:fit-content;max-width:100%;   /* so gradients span the text, not the whole card */
  }
  .display.fx-solid{color:var(--n1)}
  .display.fx-gradient{
    background:linear-gradient(90deg, var(--n1), var(--n2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .display.fx-glow{
    color:var(--n1);
    text-shadow:0 0 10px color-mix(in srgb, var(--n1) 65%, transparent), 0 0 26px color-mix(in srgb, var(--n1) 40%, transparent);
  }
  .display.fx-neon{
    color:var(--neon-fill);
    text-shadow:0 0 3px var(--n1), 0 0 10px var(--n1), 0 0 22px var(--n1), 0 0 44px color-mix(in srgb, var(--n1) 70%, transparent);
    animation:neon 4s infinite;
  }
  @keyframes neon{0%,17%,21%,24%,52%,56%,100%{opacity:1}19%,23%,54%{opacity:.55}}
  .display.fx-rainbow{
    background:linear-gradient(90deg,#ff4d4d,#ffa94d,#ffe14d,#4dff88,#4dc3ff,#8c6bff,#ff4dd2,#ff4d4d);
    background-size:200% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:rainbow 4s linear infinite;
  }
  @keyframes rainbow{to{background-position:200% 0}}
  .display.fx-shimmer{
    background:linear-gradient(110deg, var(--n1) 0%, var(--n1) 42%, color-mix(in srgb, var(--n1) 25%, #fff) 50%, var(--n1) 58%, var(--n1) 100%);
    background-size:250% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shimmer 3s ease-in-out infinite;
  }
  @keyframes shimmer{0%{background-position:100% 0}70%,100%{background-position:0% 0}}
  .display.fx-toon{
    color:var(--n1);
    -webkit-text-stroke:1.5px #0b0b10;paint-order:stroke fill;
    text-shadow:3px 3px 0 #0b0b10;
  }
  .display.fx-pop{
    color:var(--n1);
    text-shadow:1px 1px 0 var(--n2),2px 2px 0 var(--n2),3px 3px 0 var(--n2),4px 4px 0 var(--n2),6px 6px 10px rgba(0,0,0,.35);
  }
  .display.fx-glitch{color:var(--n1)}
  .display.fx-glitch::before,.display.fx-glitch::after{
    content:attr(data-text);position:absolute;inset:0;pointer-events:none;
  }
  .display.fx-glitch::before{color:#ff2d75;animation:glitch-a 2.6s infinite steps(1)}
  .display.fx-glitch::after{color:#2de2ff;animation:glitch-b 2.6s infinite steps(1)}
  @keyframes glitch-a{
    0%,86%,100%{transform:none;clip-path:inset(0 0 100% 0)}
    88%{transform:translate(3px,-1px);clip-path:inset(10% 0 55% 0)}
    92%{transform:translate(-3px,1px);clip-path:inset(62% 0 6% 0)}
    96%{transform:translate(2px,0);clip-path:inset(30% 0 42% 0)}
  }
  @keyframes glitch-b{
    0%,86%,100%{transform:none;clip-path:inset(0 0 100% 0)}
    89%{transform:translate(-3px,1px);clip-path:inset(55% 0 12% 0)}
    93%{transform:translate(3px,0);clip-path:inset(8% 0 70% 0)}
    97%{transform:translate(-2px,-1px);clip-path:inset(40% 0 30% 0)}
  }

  .handle-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-top:8px;color:var(--muted)}
  .handle{font-weight:500;color:var(--ink)}
  .guild-tag{
    display:inline-flex;align-items:center;gap:4px;
    padding:1px 7px 1px 4px;border-radius:6px;
    background:var(--card);border:1px solid var(--line);
    font-size:12.5px;font-weight:600;color:var(--ink);
  }
  .guild-tag img{width:16px;height:16px}
  .pronouns{font-size:13px}
  .copy-btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:4px 10px;border-radius:999px;cursor:pointer;
    background:var(--card);border:1px solid var(--line);
    font-size:12.5px;font-weight:600;color:var(--muted);
    transition:border-color .15s ease,color .15s ease;
  }
  .copy-btn:hover{border-color:var(--accent);color:var(--ink)}
  .copy-btn.done{border-color:var(--online);color:var(--online)}

  .custom-status{
    display:inline-flex;align-items:center;gap:8px;margin-top:12px;
    padding:7px 12px;border-radius:12px 12px 12px 4px;
    background:var(--card);border:1px solid var(--line);
    font-size:14px;max-width:100%;
  }
  .custom-status img{width:20px;height:20px;flex:none}
  .custom-status .e{font-size:18px;line-height:1}

  .platforms{margin-top:10px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .platforms i{width:8px;height:8px;border-radius:50%;background:var(--offline);flex:none}
  .platforms[data-s="online"] i{background:var(--online)}
  .platforms[data-s="idle"] i{background:var(--idle)}
  .platforms[data-s="dnd"] i{background:var(--dnd)}

  .cta{
    display:inline-flex;align-items:center;gap:9px;margin-top:14px;
    padding:9px 16px;border-radius:10px;text-decoration:none;
    background:var(--accent);color:var(--accent-ink);
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;
    transition:filter .15s ease, transform .08s ease;
  }
  .cta:hover{filter:brightness(1.12)}
  .cta:active{transform:translateY(1px)}
  .cta svg{width:18px;height:18px;fill:currentColor}

  /* ---------- sections ---------- */
  .panel{padding:22px 24px 26px;display:flex;flex-direction:column;gap:22px}
  .label{
    font-family:'Space Grotesk',sans-serif;font-weight:700;
    font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);margin:0 0 8px;
  }
  .about p{margin:0;white-space:pre-line;overflow-wrap:anywhere}
  .about a{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
  .about img.emoji{width:22px;height:22px;vertical-align:-5px}
  .caret{display:inline-block;width:2px;height:1.05em;margin-left:2px;vertical-align:-2px;background:currentColor;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  .links-buttons{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
  .link-btn{
    display:flex;align-items:center;gap:10px;min-width:0;
    padding:10px 12px;border-radius:12px;text-decoration:none;
    background:var(--card-2);border:1px solid var(--line);
    font-weight:600;font-size:14px;
    transition:border-color .15s ease, transform .12s ease;
  }
  .link-btn svg{width:20px;height:20px;flex:none;fill:currentColor;transition:fill .15s ease}
  .link-btn .l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .link-btn .go{color:var(--faint);font-size:13px}
  .links-icons{display:flex;flex-wrap:wrap;gap:8px}
  .link-icon{
    width:46px;height:46px;display:grid;place-items:center;border-radius:12px;
    background:var(--card-2);border:1px solid var(--line);
    transition:border-color .15s ease, transform .12s ease;
  }
  .link-icon svg{width:22px;height:22px;fill:currentColor;transition:fill .15s ease}
  .link-btn:hover,.link-icon:hover,.link-btn:focus-visible,.link-icon:focus-visible{border-color:var(--brand, var(--accent));transform:translateY(-1px)}
  .link-btn:hover svg,.link-icon:hover svg,.link-btn:focus-visible svg,.link-icon:focus-visible svg{fill:var(--brand, var(--accent))}

  .activities{display:grid;gap:10px}
  .activity{
    display:flex;gap:14px;align-items:center;
    background:var(--card-2);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;text-decoration:none;
  }
  a.activity:hover{border-color:var(--accent)}
  .activity .art{
    width:60px;height:60px;flex:none;border-radius:10px;position:relative;
    display:grid;place-items:center;font-size:28px;
    background:color-mix(in srgb, var(--accent) 22%, var(--card));
  }
  .activity .art > img{width:100%;height:100%;object-fit:cover;border-radius:10px}
  .activity .art .small{
    position:absolute;right:-5px;bottom:-5px;width:24px;height:24px;border-radius:50%;
    border:3px solid var(--card-2);background:var(--card-2);object-fit:cover;
  }
  .activity .body{min-width:0;flex:1}
  .activity .kind{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .activity .what{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .activity .detail{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .activity .time{color:var(--online);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
  .bar{height:4px;border-radius:2px;background:var(--line);margin-top:8px;overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--ink);width:0}
  .bar-times{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px}

  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .fact{
    background:var(--card-2);border:1px solid var(--line);border-radius:12px;
    padding:10px 14px;
  }
  .fact .k{font-size:12px;color:var(--muted)}
  .fact .v{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;margin-top:2px}

  .live{margin-top:14px;text-align:center;font-size:12px;color:var(--faint);transition:opacity .45s ease}
  .live i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--faint);margin-right:6px;vertical-align:1px}
  .live.on i{background:var(--online);box-shadow:0 0 0 3px color-mix(in srgb, var(--online) 25%, transparent)}

  .foot{margin-top:18px;text-align:center;color:var(--faint);font-size:12.5px}
  .foot a{color:var(--muted)}

  /* ---------- show / hide (set from the control panel) ---------- */
  .hide-banner #banner-img,.hide-decoration #deco,.hide-statusDot #status,.hide-nameplate #nameplate,.hide-badges #badges,
  .hide-serverTag #guild-tag,.hide-pronouns #pronouns,.hide-copyButton #copy-btn,
  .hide-customStatus #custom-status,.hide-platforms #platforms,.hide-discordButton #discord-cta,
  .hide-liveIndicator #live,.hide-themeToggle #theme-btn,.hide-footer #foot{display:none !important}

  @media (max-width:480px){
    body{padding-top:24px}
    .head,.panel{padding-left:16px;padding-right:16px}
    .banner{height:150px}
    .avatar-wrap{width:116px;height:116px;margin-top:-60px}
    .status{right:10px;bottom:10px}
    .badges{right:12px;top:12px}
    .badge{width:26px;height:26px}
    .badge img{width:19px;height:19px}
    .display{font-size:calc(var(--name-size, 28px) * .9)}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important}
    .display,.caret{animation:none !important}
    .display::before,.display::after{display:none}
  }
</style>

      <img id="banner-img" alt="" hidden>

    <header class="head">
      <div class="avatar-wrap">

          </div>
          <div class="custom-status" id="custom-status" hidden></div>
          <div class="platforms" id="platforms" hidden><i></i><span></span></div>
          <a class="cta" id="discord-cta" target="_blank" rel="noopener"></a>
        </div>
      </div>
    </header>

    <section class="panel">
      <div class="section" id="bio-section" hidden>
        <h2 class="label">About Me</h2>
        <div class="about" id="bio"></div>
      </div>
      <div class="section" id="links-section" hidden>
        <h2 class="label">Links</h2>
        <div class="links" id="links"></div>
      </div>
      <div class="section" id="activity-section" hidden>
        <h2 class="label">Activity</h2>
        <div class="activities" id="activities"></div>
      </div>
      <div class="section" id="facts-section">
        <h2 class="label">Info</h2>
        <div class="facts" id="facts"></div>
      </div>
    </section>
  </article>

  <p class="live" id="live"><i></i><span>Connecting to Discord…</span></p>
  <p class="foot" id="foot">made by <span id="foot-name">haoni</span> · <a href="https://github.com/HAONI1028/haoni" target="_blank" rel="noopener">source</a></p>
</main>

<script>
/* =====================================================================
   Everything on this page comes from Discord (live), plus the look you
   choose in the control panel (panel.html), which is saved to Lanyard KV.
   ===================================================================== */
const S = window.SiteSettings;
const FX = window.SiteEffects || { setParticles() {}, setCursor() {}, setTilt() {}, refreshColors() {} };
const ID = S.DISCORD_ID;
const CDN = "https://cdn.discordapp.com";
const PREVIEW = new URLSearchParams(location.search).has("preview");
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

// What the page shows before the live data arrives (or if it can't load).
const SNAPSHOT = {
  id: ID,
  username: "haoni1028",
  global_name: "HAONI",
  avatar: "4544384a53cc2459cbefc546aec48267",
  banner: "a_9f2985c88b85543909d28f217d08c79b",
  banner_color: "#7b00ff",
  public_flags: 128,
  nitro: true,
  avatar_decoration_data: { asset: "a_ab6beffdbc7e82cd59af53b845f13a3c" },
  collectibles: { nameplate: { asset: "nameplates/special_events_2/nitro_rocketfuel_nameplate/" } },
  display_name_styles: { font_id: 6, effect_id: 3, colors: [1874155] },
  primary_guild: { identity_guild_id: "1386407365653299352", identity_enabled: true, tag: "NES", badge: "abfcf0314946253b157797a648829c11" },
};

const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  kids.flat().forEach(k => k != null && n.append(k));
  return n;
};
const setSrc = (img, url) => { if (img.getAttribute("src") !== url) img.src = url; };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};

// Discord profile badges: [flag bit, label, icon hash]
const BADGES = [
  [1 << 0,  "Discord Staff",                   "5e74e9b61934fc1f67c65515d1f7e60d"],
  [1 << 1,  "Partnered Server Owner",          "3f9748e53446a137a052f3454e2de41e"],
  [1 << 18, "Moderator Programs Alumni",       "fee1624003e2fee35cb398e125dc479b"],
  [1 << 2,  "HypeSquad Events",                "bf01d1073931f921909045f3a39fd264"],
  [1 << 6,  "HypeSquad Bravery",               "8a88d63823d8a71cd5e390baa45efa02"],
  [1 << 7,  "HypeSquad Brilliance",            "011940fd013da3f7fb926e4a1cd2e618"],
  [1 << 8,  "HypeSquad Balance",               "3aa41de486fa12454c3761e8e223442e"],
  [1 << 3,  "Discord Bug Hunter",              "2717692c7dca7289b35297368a940dd0"],
  [1 << 14, "Discord Bug Hunter",              "848f79194d4be5ff5f81505cbd0ce1e6"],
  [1 << 22, "Active Developer",                "6bdc42827a38498929a4920da12695d9"],
  [1 << 17, "Early Verified Bot Developer",    "6df5892e0f35b051f8b61eace34f4967"],
  [1 << 9,  "Early Supporter",                 "7060786766c9c840eb3019e725d2b358"],
];
const NITRO_BADGE = ["Nitro", "2ba85e8026a8614b640c2837bcdfe21b"];

/* ---------- state ---------- */
const state = {
  user: { ...SNAPSHOT },
  presence: null,
  settings: S.defaults(),
  siteRaw: null,      // last raw settings string seen (to skip needless re-renders)
  preview: null,      // settings sent by the control panel's preview
  revealed: false,
};
const createdAt = new Date(Number((BigInt(ID) >> 22n) + 1420070400000n));

const settings = () => (state.preview ? state.preview.settings : state.settings);
const kv = () => (state.presence && state.presence.kv) || {};
const bioText = () => (state.preview ? state.preview.bio : kv().bio || "");
const pronounsText = () => (state.preview ? state.preview.pronouns : kv().pronouns || "");

/* ---------- helpers ---------- */
const hex = (n) => "#" + n.toString(16).padStart(6, "0");
function readableInk(color) {
  const c = color.replace("#", "");
  const [r, g, b] = [0, 2, 4].map(i => parseInt(c.slice(i, i + 2), 16) / 255)
    .map(v => v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4);
  return (0.2126 * r + 0.7152 * g + 0.0722 * b) > 0.45 ? "#111216" : "#FFFFFF";
}
const avatarURL = (u, size = 256) => u.avatar
  ? `${CDN}/avatars/${u.id}/${u.avatar}.${u.avatar.startsWith("a_") && !reducedMotion ? "gif" : "png"}?size=${size}`
  : `${CDN}/embed/avatars/${Number((BigInt(u.id) >> 22n) % 6n)}.png`;
const emojiURL = (id, animated, size = 48) => `${CDN}/emojis/${id}.${animated && !reducedMotion ? "gif" : "webp"}?size=${size}&quality=lossless`;
function fmtDuration(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = String(s % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${sec}` : `${m}:${sec}`;
}

// Text with [links](https://…), <:emoji:id>, <a:emoji:id> and bare URLs
function richText(text) {
  const out = [];
  const re = /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)|<(a?):(\w+):(\d+)>|(https?:\/\/[^\s<]+)/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    out.push(text.slice(last, m.index));
    if (m[1]) out.push(el("a", { href: m[2], target: "_blank", rel: "noopener", textContent: m[1] }));
    else if (m[4]) out.push(el("img", { className: "emoji", src: emojiURL(m[5], m[3] === "a"), alt: `:${m[4]}:`, title: `:${m[4]}:` }));
    else out.push(el("a", { href: m[6], target: "_blank", rel: "noopener", textContent: m[6] }));
    last = m.index + m[0].length;
  }
  out.push(text.slice(last));
  return out.filter(p => p !== "");
}

/* ---------- look: theme, background, card, font, effects, show/hide, custom CSS ---------- */
function applyTheme() {
  const s = settings(), root = document.documentElement;
  let mode = s.themeMode;
  const saved = PREVIEW ? null : store.get("theme");
  if (saved === "dark" || saved === "light") mode = saved;
  if (mode === "dark" || mode === "light") root.dataset.theme = mode;
  else delete root.dataset.theme;
  FX.refreshColors();
}

function applyBackground() {
  const s = settings(), u = state.user, pg = $("page-bg");
  let url = "";
  if (s.background === "image") url = s.backgroundImage;
  else if (s.background === "banner" && u.banner) url = `${CDN}/banners/${u.id}/${u.banner}.png?size=600`;
  pg.style.backgroundImage = url ? `url("${url.replace(/["\\]/g, encodeURIComponent)}")` : "";
  pg.hidden = !url;
}

let fontLink = null;
function applyFont(id) {
  document.documentElement.style.setProperty("--name-font", S.fontFamily(id));
  if (id === "Space Grotesk") return; // already loaded above
  const href = S.fontURL(id);
  if (!fontLink) { fontLink = el("link", { rel: "stylesheet" }); document.head.append(fontLink); }
  if (fontLink.getAttribute("href") !== href) fontLink.href = href;
}

function applyLook() {
  const s = settings(), root = document.documentElement;
  for (const [k] of S.SHOW) root.classList.toggle("hide-" + k, !s.show[k]);
  root.classList.toggle("card-glass", s.cardStyle === "glass");
  for (const b of S.BACKGROUNDS) root.classList.toggle("bg-" + b.id, s.background === b.id);
  applyBackground();
  applyFont(s.nameFont);
  root.style.setProperty("--name-size", (S.NAME_SIZES.find(x => x.id === s.nameSize) || S.NAME_SIZES[1]).px + "px");
  applyTheme();
  FX.setParticles(s.particles);
  FX.setCursor(s.cursor);
  FX.setTilt($("card"), s.tilt);
  $("custom-css").textContent = s.customCss;
}

/* ---------- profile (name, avatar, decoration, nameplate, tag, badges, colours, banner) ---------- */
function applyNameStyle(name) {
  const s = settings(), u = state.user, dn = $("display-name");
  const root = document.documentElement.style;
  const st = u.display_name_styles || {};
  const dc = (st.colors || []).map(hex);
  const n1 = s.nameColors === "custom" ? s.nameColor1 : dc[0] || "var(--ink)";
  const n2 = s.nameColors === "custom" ? s.nameColor2 : dc[1] || "var(--accent)";
  root.setProperty("--n1", n1);
  root.setProperty("--n2", n2);
  let fx = s.nameEffect;
  if (fx === "discord") fx = dc.length > 1 ? "gradient" : st.effect_id ? "glow" : "solid";
  dn.className = "display fx-" + fx;
  dn.dataset.text = name;
}

function renderUser() {
  const u = state.user, s = settings();
  const name = s.displayName || u.global_name || u.display_name || u.username;

  document.title = s.tabTitle || name;
  $("display-name").textContent = name;
  $("foot-name").textContent = name.toLowerCase();
  $("handle").textContent = s.username || u.username;
  applyNameStyle(name);

  // avatar + decoration
  const av = $("avatar");
  setSrc(av, avatarURL(u));
  av.alt = `${name}'s avatar`;
  av.onerror = () => { av.onerror = null; av.src = `${CDN}/embed/avatars/0.png`; };
  $("favicon").href = avatarURL(u, 64);

  const deco = u.avatar_decoration_data && u.avatar_decoration_data.asset;
  $("deco").hidden = !deco;
  if (deco) setSrc($("deco"), `${CDN}/avatar-decoration-presets/${deco}.png?size=240&passthrough=${!reducedMotion}`);

  // nameplate
  const np = u.collectibles && u.collectibles.nameplate && u.collectibles.nameplate.asset;
  const vid = $("nameplate");
  vid.hidden = !np;
  if (np) {
    const base = `${CDN}/assets/collectibles/${np}`;
    if (vid.getAttribute("poster") !== base + "static.png") {
      vid.poster = base + "static.png";
      if (!reducedMotion) { vid.src = base + "asset.webm"; vid.play().catch(() => {}); }
    }
  }

  // server tag
  const g = u.primary_guild || u.clan;
  const tagEl = $("guild-tag");
  tagEl.hidden = !(g && g.identity_enabled && g.tag);
  if (!tagEl.hidden) {
    const kids = [];
    if (g.badge) kids.push(el("img", { src: `${CDN}/guild-tag-badges/${g.identity_guild_id}/${g.badge}.png?size=32`, alt: "" }));
    kids.push(g.tag);
    tagEl.replaceChildren(...kids);
    tagEl.title = "Server tag";
  }

  // badges
  const flags = u.public_flags || 0;
  const list = BADGES.filter(([bit]) => flags & bit).map(([, label, icon]) => [label, icon]);
  if (u.nitro) list.unshift(NITRO_BADGE);
  $("badges").hidden = list.length === 0;
  $("badges").replaceChildren(...list.map(([label, icon]) =>
    el("span", { className: "badge", tabIndex: 0, ariaLabel: label },
      el("img", { src: `${CDN}/badge-icons/${icon}.png`, alt: "" }),
      el("span", { className: "tip", textContent: label }))
  ));

  // accent colour (Discord profile colour unless overridden) + banner
  const root = document.documentElement.style;
  const discordColor = u.banner_color || (u.accent_color != null ? hex(u.accent_color) : null);
  const color = s.accentSource === "custom" ? s.accent : discordColor;
  if (color) {
    root.setProperty("--accent", color);
    root.setProperty("--accent-ink", readableInk(color));
    document.querySelector('meta[name="theme-color"]').content = color;
  }
  const bImg = $("banner-img");
  bImg.hidden = !u.banner;
  if (u.banner) {
    const animated = u.banner.startsWith("a_") && !reducedMotion;
    setSrc(bImg, `${CDN}/banners/${u.id}/${u.banner}.${animated ? "gif" : "png"}?size=1024`);
  }
  applyBackground();
  FX.refreshColors();

  // add-me button
  const cta = $("discord-cta");
  cta.href = `https://discord.com/users/${u.id}`;
  cta.replaceChildren(S.discordIcon(), s.discordButtonText + " ↗");
}

/* ---------- bio (Lanyard KV "bio") with optional typewriter ---------- */
let bioKey = null, typeRun = 0;
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const graphemes = (str) => (typeof Intl.Segmenter === "function"
  ? [...new Intl.Segmenter(undefined, { granularity: "grapheme" }).segment(str)].map(x => x.segment)
  : [...str]);

async function typewrite(p, parts, run) {
  const caret = el("span", { className: "caret" });
  p.append(caret);
  for (const part of parts) {
    if (run !== typeRun) return;
    if (typeof part === "string" || part.tagName === "A") {
      const text = typeof part === "string" ? part : part.textContent;
      const target = typeof part === "string" ? document.createTextNode("") : part;
      if (target !== part) p.insertBefore(target, caret);
      else { part.textContent = ""; p.insertBefore(part, caret); }
      for (const ch of graphemes(text)) {
        if (run !== typeRun) return;
        if (target.nodeType === 3) target.data += ch; else target.textContent += ch;
        await sleep(ch === "\n" ? 200 : 32);
      }
    } else {
      p.insertBefore(part, caret);
      await sleep(80);
    }
  }
}

function renderBio() {
  const s = settings();
  const bio = bioText().trim();
  const show = s.show.bio && !!bio;
  $("bio-section").hidden = !show;
  const key = show ? bio + "\u0000" + s.typewriter : null;
  if (key === bioKey) return; // unchanged — don't restart the typewriter
  bioKey = key;
  typeRun++;
  if (!show) { $("bio").replaceChildren(); return; }
  if (s.typewriter && !reducedMotion) {
    const shown = el("p");
    shown.setAttribute("aria-hidden", "true");
    $("bio").replaceChildren(el("p", { className: "sr-only" }, richText(bio)), shown);
    typewrite(shown, richText(bio), typeRun);
  } else {
    $("bio").replaceChildren(el("p", {}, richText(bio)));
  }
}
function renderPronouns() {
  const pr = pronounsText().trim();
  $("pronouns").hidden = !pr;
  $("pronouns").textContent = pr ? "• " + pr : "";
}

/* ---------- links ---------- */
function renderLinks() {
  const s = settings();
  const links = s.show.links ? s.links : [];
  $("links-section").hidden = links.length === 0;
  const box = $("links");
  box.className = "links links-" + s.linkStyle;
  box.replaceChildren(...links.map(l => {
    const info = S.linkInfo(l.url);
    const label = l.label || info.name;
    const a = el("a", { href: l.url, target: "_blank", rel: "noopener me" });
    if (info.color) a.style.setProperty("--brand", info.color);
    if (s.linkStyle === "icons") {
      a.className = "link-icon";
      a.title = label;
      a.setAttribute("aria-label", label);
      a.append(S.iconSVG(info));
    } else {
      a.className = "link-btn";
      a.append(S.iconSVG(info), el("span", { className: "l", textContent: label }), el("span", { className: "go", textContent: "↗" }));
    }
    return a;
  }));
}

/* ---------- presence (status, platforms, custom status, activities, Spotify) ---------- */
const STATUS_NAMES = { online: "Online", idle: "Idle", dnd: "Do Not Disturb", offline: "Offline" };
const KINDS = { 0: "Playing", 1: "Streaming", 2: "Listening to", 3: "Watching", 5: "Competing in" };
const appIcons = {};

async function appIcon(appId, placeholder) {
  if (!(appId in appIcons)) {
    appIcons[appId] = fetch(`https://discord.com/api/v10/applications/${appId}/rpc`)
      .then(r => r.ok ? r.json() : null)
      .then(j => j && j.icon ? `${CDN}/app-icons/${appId}/${j.icon}.png?size=128` : null)
      .catch(() => null);
  }
  const url = await appIcons[appId];
  if (url && placeholder.isConnected) placeholder.replaceWith(el("img", { src: url, alt: "" }));
}

function assetURL(a, key) {
  const v = a.assets && a.assets[key];
  if (!v) return null;
  if (v.startsWith("mp:")) return `https://media.discordapp.net/${v.slice(3)}`;
  if (v.startsWith("spotify:")) return `https://i.scdn.co/image/${v.slice(8)}`;
  if (a.application_id) return `${CDN}/app-assets/${a.application_id}/${v}.png`;
  return null;
}

function renderPresence() {
  const d = state.presence, s = settings();
  const st = (d && d.discord_status) || "offline";
  $("status").dataset.s = st;
  $("status").setAttribute("aria-label", `Status: ${STATUS_NAMES[st]}`);
  $("status").title = STATUS_NAMES[st];
  if (!d) return;

  // platforms
  const on = [
    d.active_on_discord_desktop && "desktop",
    d.active_on_discord_web && "web",
    d.active_on_discord_mobile && "mobile",
    d.active_on_discord_vr && "VR",
  ].filter(Boolean);
  const pl = $("platforms");
  pl.hidden = false;
  pl.dataset.s = st;
  pl.querySelector("span").textContent = st === "offline" ? "Offline" : `${STATUS_NAMES[st]}${on.length ? " on " + on.join(", ") : ""}`;

  const acts = d.activities || [];

  // custom status
  const cs = acts.find(a => a.type === 4);
  const csEl = $("custom-status");
  csEl.hidden = !(cs && (cs.state || cs.emoji));
  if (!csEl.hidden) {
    const kids = [];
    if (cs.emoji) {
      kids.push(cs.emoji.id
        ? el("img", { src: emojiURL(cs.emoji.id, cs.emoji.animated), alt: `:${cs.emoji.name}:` })
        : el("span", { className: "e", textContent: cs.emoji.name }));
    }
    if (cs.state) kids.push(el("span", { textContent: cs.state }));
    csEl.replaceChildren(...kids);
  }

  // activities
  const cards = [];
  if (s.show.spotify && d.listening_to_spotify && d.spotify) {
    const sp = d.spotify;
    const card = el("a", { className: "activity", href: `https://open.spotify.com/track/${sp.track_id}`, target: "_blank", rel: "noopener" },
      el("div", { className: "art" }, sp.album_art_url ? el("img", { src: sp.album_art_url, alt: "" }) : "🎵"),
      el("div", { className: "body" },
        el("div", { className: "kind", textContent: "Listening to Spotify" }),
        el("div", { className: "what", textContent: sp.song }),
        el("div", { className: "detail", textContent: `by ${sp.artist}` }),
        el("div", { className: "bar" }, el("i")),
        el("div", { className: "bar-times" }, el("span", { className: "t-now" }), el("span", { className: "t-end" }))
      ));
    card.dataset.start = sp.timestamps.start;
    card.dataset.end = sp.timestamps.end;
    cards.push(card);
  }
  for (const a of s.show.activity ? acts : []) {
    if (a.type === 4) continue;
    if (a.type === 2 && a.name === "Spotify" && d.listening_to_spotify) continue;
    const large = assetURL(a, "large_image"), small = assetURL(a, "small_image");
    const art = el("div", { className: "art" });
    if (large) art.append(el("img", { src: large, alt: "", title: (a.assets && a.assets.large_text) || "" }));
    else {
      const ph = el("span", { textContent: "🎮" });
      art.append(ph);
      if (a.application_id) appIcon(a.application_id, ph);
    }
    if (small) art.append(el("img", { className: "small", src: small, alt: "", title: (a.assets && a.assets.small_text) || "" }));
    const isStream = a.type === 1 && a.url;
    const card = el(isStream ? "a" : "div", { className: "activity" },
      art,
      el("div", { className: "body" },
        el("div", { className: "kind", textContent: KINDS[a.type] || "Playing" }),
        el("div", { className: "what", textContent: a.name }),
        a.details ? el("div", { className: "detail", textContent: a.details }) : null,
        a.state ? el("div", { className: "detail", textContent: a.state }) : null,
        a.timestamps && a.timestamps.start ? el("div", { className: "time" }) : null
      ));
    if (isStream) Object.assign(card, { href: a.url, target: "_blank", rel: "noopener" });
    if (a.timestamps && a.timestamps.start) card.dataset.start = a.timestamps.start;
    cards.push(card);
  }
  $("activity-section").hidden = cards.length === 0;
  $("activities").replaceChildren(...cards);
  tickTimers();
}

function tickTimers() {
  const now = Date.now();
  document.querySelectorAll(".activity[data-start]").forEach(c => {
    const start = +c.dataset.start, end = +c.dataset.end;
    if (end) {
      const total = end - start, cur = Math.min(now - start, total);
      c.querySelector(".bar > i").style.width = (cur / total * 100) + "%";
      c.querySelector(".t-now").textContent = fmtDuration(cur);
      c.querySelector(".t-end").textContent = fmtDuration(total);
    } else {
      const t = c.querySelector(".time");
      if (t) t.textContent = `${fmtDuration(now - start)} elapsed`;
    }
  });
}

/* ---------- info ---------- */
function renderFacts() {
  const s = settings(), facts = [];
  if (s.show.memberSince) facts.push(["Member Since", createdAt.toLocaleDateString([], { year: "numeric", month: "short", day: "numeric" })]);
  if (s.show.localTime) {
    try { facts.push(["Local Time", new Intl.DateTimeFormat([], { hour: "numeric", minute: "2-digit", timeZone: s.timezone }).format(new Date())]); } catch {}
  }
  $("facts-section").hidden = facts.length === 0;
  $("facts").replaceChildren(...facts.map(([k, v]) =>
    el("div", { className: "fact" }, el("div", { className: "k", textContent: k }), el("div", { className: "v", textContent: v }))
  ));
}

function renderAll() {
  renderUser();
  renderBio();
  renderPronouns();
  renderLinks();
  renderPresence();
  renderFacts();
}

function reveal() {
  if (state.revealed) return;
  state.revealed = true;
  document.documentElement.classList.remove("js-loading");
}

/* ---------- copy username (always the real Discord username) ---------- */
$("copy-btn").onclick = async (e) => {
  const btn = e.currentTarget, name = state.user.username;
  try { await navigator.clipboard.writeText(name); }
  catch {
    const t = el("textarea", { value: name });
    document.body.append(t); t.select();
    try { document.execCommand("copy"); } catch {}
    t.remove();
  }
  btn.textContent = "Copied!"; btn.classList.add("done");
  setTimeout(() => { btn.textContent = "Copy username"; btn.classList.remove("done"); }, 1600);
};

/* ---------- theme toggle (a visitor's choice beats the default) ---------- */
$("theme-btn").onclick = () => {
  const root = document.documentElement;
  const isLight = root.dataset.theme
    ? root.dataset.theme === "light"
    : matchMedia("(prefers-color-scheme: light)").matches;
  root.dataset.theme = isLight ? "dark" : "light";
  if (!PREVIEW) store.set("theme", root.dataset.theme);
  FX.refreshColors();
};
matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => FX.refreshColors());

/* =====================================================================
   LIVE DATA
   - Lanyard WebSocket: status, activities, Spotify, custom status, avatar,
     name, decoration, nameplate, server tag, bio, and your control-panel
     settings (KV) — pushed instantly.
   - japi.rest: banner, profile colour, Nitro badge (refreshed every 10 min).
   ===================================================================== */
function setLive(on, text) {
  $("live").classList.toggle("on", on);
  $("live").querySelector("span").textContent = text;
}

function applyPresence(d) {
  if (!d || !d.discord_user) return;
  state.presence = d;
  const du = d.discord_user;
  Object.assign(state.user, {
    username: du.username,
    global_name: du.global_name || du.display_name,
    avatar: du.avatar,
    public_flags: du.public_flags,
    avatar_decoration_data: du.avatar_decoration_data || null,
    collectibles: du.collectibles || null,
    display_name_styles: du.display_name_styles || null,
    primary_guild: du.primary_guild || null,
  });
  const raw = (d.kv && d.kv.site) || "";
  if (raw !== state.siteRaw) {
    state.siteRaw = raw;
    state.settings = S.sanitize(raw);
    if (!PREVIEW) store.set("haoni.site", raw || null);
    if (!state.preview) applyLook();
  }
  renderAll();
  reveal();
}

async function loadProfileExtras() {
  try {
    const r = await fetch(`https://japi.rest/discord/v1/user/${ID}`);
    if (!r.ok) return;
    const { data } = await r.json();
    if (!data) return;
    Object.assign(state.user, {
      banner: data.banner || null,
      banner_color: data.banner_color || null,
      accent_color: data.accent_color,
      nitro: (data.public_flags_array || []).includes("NITRO"),
    });
    // fill in profile fields too if Lanyard isn't connected
    if (!state.presence) Object.assign(state.user, {
      username: data.username, global_name: data.global_name, avatar: data.avatar,
      public_flags: data.public_flags, avatar_decoration_data: data.avatar_decoration_data || null,
      collectibles: data.collectibles || null, display_name_styles: data.display_name_styles || null,
      primary_guild: data.primary_guild || data.clan || null,
    });
    renderUser();
  } catch {}
}

let ws, heartbeat, retries = 0, pollTimer;
function connectSocket() {
  try { ws = new WebSocket(S.LANYARD_SOCKET); }
  catch { return startPolling(); }
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.op === 1) {
      clearInterval(heartbeat);
      heartbeat = setInterval(() => ws.readyState === 1 && ws.send(JSON.stringify({ op: 3 })), m.d.heartbeat_interval);
      ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: ID } }));
    } else if (m.op === 0 && (m.t === "INIT_STATE" || m.t === "PRESENCE_UPDATE")) {
      retries = 0;
      if (m.d && m.d.discord_user) { applyPresence(m.d); setLive(true, "Live from Discord"); }
      else setLive(false, "Join the Lanyard server to show live status");
    }
  };
  ws.onclose = () => {
    clearInterval(heartbeat);
    setLive(false, "Reconnecting…");
    if (++retries > 5) return startPolling();
    setTimeout(connectSocket, Math.min(30000, 1000 * 2 ** retries));
  };
}

async function pollOnce() {
  try {
    const j = await (await fetch(`${S.LANYARD_API}/users/${ID}`)).json();
    if (j.success) { applyPresence(j.data); setLive(true, "Live from Discord (updates every 30s)"); }
  } catch {}
}
function startPolling() {
  if (pollTimer) return;
  pollOnce();
  pollTimer = setInterval(pollOnce, 30000);
}

/* ---------- live preview for the control panel ---------- */
if (PREVIEW) {
  addEventListener("message", (e) => {
    if (e.origin !== location.origin || e.source !== parent) return;
    const m = e.data;
    if (!m || m.type !== "haoni:preview") return;
    state.preview = {
      settings: S.sanitize(m.settings),
      bio: typeof m.bio === "string" ? m.bio.slice(0, S.LIMITS.bio) : "",
      pronouns: typeof m.pronouns === "string" ? m.pronouns.slice(0, S.LIMITS.pronouns) : "",
    };
    applyLook();
    renderAll();
    reveal();
  });
  if (parent !== window) parent.postMessage({ type: "haoni:ready" }, "/");
}

/* ---------- go ---------- */
if (!PREVIEW) {
  const cached = store.get("haoni.site");
  if (cached) { state.siteRaw = cached; state.settings = S.sanitize(cached); }
}
applyLook();
renderAll();
if (state.siteRaw) reveal();          // returning visitor: we already know the look
setTimeout(reveal, 1500);              // never stay hidden if Discord is slow
setInterval(tickTimers, 1000);
setInterval(renderFacts, 15000);
connectSocket();
loadProfileExtras();
setInterval(loadProfileExtras, 10 * 60 * 1000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") loadProfileExtras();
});
</script>
</body>
</html>
